cap_missions:
  - group_name: CAP-Santa-Cruz-MiG29
    menu_name: CAP rouge MiG-29S (Fox 1) — Patagonie sud — FL220
    briefing: 'Deux MiG-29S armés de R-27R, R-73 et R-60 patrouillent entre Rio Gallegos et le cap Vierges, au FL220. Emport : R-73*2,R-60M*2,R-27R*2,Fuel-1500.'
  - group_name: CAP-Fuego-Su27
    menu_name: CAP rouge Su-27 (Fox 1, longue portée) — Terre de Feu argentine — FL260
    briefing: 'Deux Su-27 armés de R-27ER et R-73 patrouillent au-dessus de la côte atlantique de la Terre de Feu, au nord-est de Rio Grande, au FL260. Emport : R-73*4,R-27ER*6.'
  - group_name: CAP-Nord-MiG31
    menu_name: CAP rouge MiG-31 (intercepteur haut et rapide, R-33) — Patagonie nord — FL380
    briefing: 'Deux MiG-31 armés de R-33 patrouillent haut et vite entre Puerto Santa Cruz et San Julian, au FL380. Emport : R-40R*2,R-33*4.'
  - group_name: Raid-Tu22M
    menu_name: Raid rouge Tu-22M3 à intercepter — Pali Aike — FL300
    briefing: "Deux bombardiers Tu-22M3 chargés de bombes tournent à l'ouest de Rio Gallegos, au FL300, prêts à frapper Punta Arenas : les intercepter. Emport : FAB-500*33."
  - group_name: CAP-Falkland-F15
    menu_name: CAP bleue F-15C (Fox 3) — détroit des Falkland — FL250
    briefing: 'Deux F-15C britanniques couvrent le détroit des Falkland, de San Carlos à Goose Green, au FL250. Emport : AIM-9*4,AIM-120*4,Fuel.'
  - group_name: CAP-Magellan-F16
    menu_name: CAP bleue F-16C (Fox 3) — détroit de Magellan — FL220
    briefing: "Deux F-16C chiliens patrouillent le détroit de Magellan, autour de Punta Arenas, au FL220. Emport : AIM-120C*4,AIM-9M*2,ECM,Fuel*2."
  - group_name: CAP-Beagle-F16
    menu_name: CAP bleue F-16C (Fox 3) — canal Beagle — FL240
    briefing: "Deux F-16C chiliens patrouillent au-dessus de l'île Navarino et de Puerto Williams, au FL240. Emport : AIM-120C*4,AIM-9M*2,ECM,Fuel*2."
